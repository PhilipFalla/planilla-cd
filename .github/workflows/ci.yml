name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar uv (con cache de dependencias entre runs)
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Instalar dependencias
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      # 80% es el piso: obliga a cubrir tanto las reglas de negocio de
      # calculo.py como el camino de error de cli.py, sin exigir 100% en
      # ramas puramente defensivas que no aportan mas confianza real.
      - name: Tests con coverage gate
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=80
